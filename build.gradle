// Per-version Fabric build. Stonecutter applies this script to every Fabric node declared in
// settings.gradle (NeoForge nodes use build.neoforge.gradle); `project.minecraft_version` /
// `project.fabric_api_version` come from that node's versions/<node>/gradle.properties. Settings shared
// by both loaders live in gradle/common.gradle and gradle/modrinth.gradle.
plugins {
	id 'maven-publish'
	// Modrinth publishing (declared apply false in stonecutter.gradle). Each node gets its own
	// `modrinth` task; the root `publishFabric` task fans them out across every Minecraft version.
	id 'com.modrinth.minotaur'
}

// Minecraft 26.1+ ships unobfuscated: it uses the non-remap Loom plugin and needs no mappings.
// Older versions are obfuscated and use the remap plugin + official Mojang mappings. Both plugins
// are put on the classpath (apply false) by the controller, so the node applies the right one.
boolean unobfuscated = project.minecraft_version.startsWith('26.')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

ext.modLoader = 'fabric'

// Fabric-style versioned jar name, e.g. mcpfabric-0.2.0+1.21.8.jar.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

apply from: rootProject.file('gradle/common.gradle')

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcpfabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// Mod Menu from Modrinth's Maven
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	// Optional at runtime: Mod Menu opens the config screen and Cloth Config builds it
	// Also put on the dev client (runClient) so the screen can be tried there; neither ships in the jar
	def clothConfig = "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	def modMenu = "maven.modrinth:modmenu:${project.modmenu_version}"
	
	// Cloth Config bundles this library which the dev client does not unpack
	localRuntime "me.shedaniel.cloth:basic-math:0.6.1"
	
	if (unobfuscated) {
		// Unobfuscated Minecraft: no mappings, and mod deps need no remapping (plain implementation).
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		[clothConfig, modMenu].each {
			compileOnly(it) { transitive = false }
			localRuntime(it) { transitive = false }
		}
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		[clothConfig, modMenu].each {
			modCompileOnly(it) { transitive = false }
			modLocalRuntime(it) { transitive = false }
		}
	}
}

processResources {
	def props = [
		"version"         : version,
		"minecraft_dep"   : project.minecraft_dep,
		"loader_version"  : project.loader_version,
		"java_dep"        : javaVersion
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
	exclude 'META-INF/neoforge.mods.toml'
}

apply from: rootProject.file('gradle/modrinth.gradle')
